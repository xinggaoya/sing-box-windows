[package]
name = "sing-box-windows"
version = "2.4.0"
description = "A Tauri App"
authors = ["XingGao"]
license = "MIT"
repository = "https://github.com/xinggaoya/sing-box-windows"
edition = "2021"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[features]
default = []

[dependencies]
# 浏览器调试桥：让普通浏览器直连运行中的真实后端（dev-only，release 自动跳过）
tauri-plugin-web-dev-bridge = { git = "https://github.com/xinggaoya/tauri-plugin-web-dev-bridge", tag = "v0.1.0" }
# 使用最新稳定版本
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive"] }
ts-rs = "11.1"
# 日志
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "local-time"] }
tracing-appender = "0.2"
base64 = "0.22"
sha2 = "0.10"
semver = "1.0"
serde_yaml = "0.9"

# Tauri 2.0 最新版本
tauri = { version = "2.10.2", features = ["tray-icon", "unstable", "devtools"] }
reqwest = { version = "0.12", features = ["json", "stream", "native-tls-vendored"] }
dirs = "5.0.1"
tokio = { version = "1.48", features = ["full"] }
futures = "0.3"
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
# ⚠️ interprocess 2.4.6 / 2.4.7 是**坏发布**：其 `os/unix/` 模块调用了 tokio 中
# 并不存在的 `AsyncFd::register_with_interest`（应为 `with_interest`），
# 而该模块**只在 Linux 编译** —— Windows / macOS 完全察觉不到，
# 表现为「本地与 Windows 构建全绿，只有 Linux 构建与 CI 恒定失败」。
# interprocess 是 tauri-plugin-single-instance 的传递依赖，Cargo 无法直接约束
# 传递依赖的版本，故在此声明为直接依赖以锁定可用版本；≤2.4.5 均正常。
# 待上游修复后即可移除本约束。
interprocess = { version = ">=2.4, <2.4.6", default-features = false }
url = "2.5"
urlencoding = "2.1"
zip = "2.2"
flate2 = "1.0"
tar = "0.4"
walkdir = "2.5"
lazy_static = "1.5"
sqlx = { version = "0.8.6", features = ["runtime-tokio-native-tls", "sqlite", "chrono", "uuid"] }
chrono = { version = "0.4.42", features = ["serde"] }
thiserror = "2.0"
tauri-plugin-os = "2.3"
rfd = "0.15"
aes-gcm = "0.10"
rand = "0.8"

[target.'cfg(windows)'.dependencies]
winreg = "0.52.0"
# 提权状态探测：读取进程 token 的 TokenElevation，避免用 `net session` 这类
# 依赖系统服务的外部命令做判定（会假阴性）。版本与 Cargo.lock 中既有传递依赖一致。
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.3"
tauri-plugin-opener = "2.5"
tauri-plugin-single-instance = "2.3"
tauri-plugin-window-state = "2.3"
tauri-plugin-websocket = "2.3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["user"] }
which = "7.0"

[target.'cfg(target_os = "macos")'.dependencies]
# macOS特定依赖
core-foundation = "0.9"
security-framework = "2.9"

# release profile 沿用 cargo / tauri 默认设置（opt-level=3、codegen-units=16、
# 无 LTO、无 strip、panic=unwind）。原先的自定义 profile 在 rustc 1.97.x 下触发
# codegen bug 导致 STATUS_ACCESS_VIOLATION (0xc0000005)，dev 模式无该问题。
