[package]
name = "sing-box-windows"
version = "2.4.0"
description = "A Tauri App"
authors = ["XingGao"]
license = "MIT"
repository = "https://github.com/xinggaoya/sing-box-windows"
edition = "2021"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[features]
default = []
# 开发态调试面板（CrabNebula DevTools）；release 构建不启用，产物不含插件
devtools = ["dep:tauri-plugin-devtools", "dep:tauri-plugin-devtools-app", "tauri/dynamic-acl"]

[dependencies]
# 使用最新稳定版本
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive"] }
ts-rs = "11.1"
# 日志
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "local-time"] }
tracing-appender = "0.2"
base64 = "0.22"
sha2 = "0.10"
semver = "1.0"
serde_yaml = "0.9"

# Tauri 2.0 最新版本
tauri = { version = "2.10.2", features = ["tray-icon", "unstable", "devtools"] }
# 开发态调试插件（仅 cargo feature `devtools` 启用时参与编译）
tauri-plugin-devtools = { version = "2.2.3", optional = true }
tauri-plugin-devtools-app = { version = "2.1.4", optional = true }
reqwest = { version = "0.12", features = ["json", "stream", "native-tls-vendored"] }
dirs = "5.0.1"
# ⚠️ tokio 必须锁在 1.53 之前：tauri-plugin-single-instance 依赖的
# interprocess 2.4.7 仍调用 tokio 1.53 已移除的 `AsyncFd::register_with_interest`，
# 而该调用位于 interprocess 的 `os/unix/` 模块 —— **只在 Linux 编译**，
# 因此 Windows / macOS 完全察觉不到，表现为「Linux 构建与 CI 恒定失败」。
# 等 interprocess 跟进 tokio 1.53 后即可放开此上界。
tokio = { version = "~1.52", features = ["full"] }
futures = "0.3"
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
url = "2.5"
urlencoding = "2.1"
zip = "2.2"
flate2 = "1.0"
tar = "0.4"
walkdir = "2.5"
lazy_static = "1.5"
sqlx = { version = "0.8.6", features = ["runtime-tokio-native-tls", "sqlite", "chrono", "uuid"] }
chrono = { version = "0.4.42", features = ["serde"] }
thiserror = "2.0"
tauri-plugin-os = "2.3"
rfd = "0.15"
aes-gcm = "0.10"
rand = "0.8"

[target.'cfg(windows)'.dependencies]
winreg = "0.52.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.3"
tauri-plugin-opener = "2.5"
tauri-plugin-single-instance = "2.3"
tauri-plugin-window-state = "2.3"
tauri-plugin-websocket = "2.3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["user"] }
which = "7.0"

[target.'cfg(target_os = "macos")'.dependencies]
# macOS特定依赖
core-foundation = "0.9"
security-framework = "2.9"

# release profile 沿用 cargo / tauri 默认设置（opt-level=3、codegen-units=16、
# 无 LTO、无 strip、panic=unwind）。原先的自定义 profile 在 rustc 1.97.x 下触发
# codegen bug 导致 STATUS_ACCESS_VIOLATION (0xc0000005)，dev 模式无该问题。
